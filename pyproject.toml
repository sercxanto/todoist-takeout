[build-system]
# hatch-fancy-pypi-readme writes the PyPI description at build time (see below); it is installed into
# the isolated build environment only, never with the package.
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "todoist-takeout"
description = "Keeps a complete, long-term readable local backup of a Todoist account."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version", "readme"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/sercxanto/todoist-takeout"
Documentation = "https://github.com/sercxanto/todoist-takeout#documentation"
Issues = "https://github.com/sercxanto/todoist-takeout/issues"
Changelog = "https://github.com/sercxanto/todoist-takeout/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "datasette>=0.65.5,<0.66",
    "hatch-fancy-pypi-readme>=25.1",
    "pytest>=7",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "ty>=0.0.91",
]

[project.scripts]
todoist-takeout = "todoist_takeout.cli:main"

[tool.hatch.version]
path = "src/todoist_takeout/__init__.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# The README links to files of the repository on main; the description of each version on PyPI links
# to that version's tag instead, so it keeps showing the documentation of that version.
# tests/test_release.py checks the result.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'https://github\.com/sercxanto/todoist-takeout/(blob|raw)/main/'
replacement = 'https://github.com/sercxanto/todoist-takeout/\1/v$HFPR_VERSION/'

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_takeout"]

[tool.hatch.build.targets.sdist]
# The whole test suite with its fixtures, the fixture recorder it loads and the documentation whose
# links it checks, and the changelog with the history of the release, so tests run from an unpacked sdist.
include = ["src/", "tests/", "scripts/", "docs/", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]
exclude = ["tests/contract/findings/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, Pyflakes, import sorting, pyupgrade and bugbear. Line length is left to the
# formatter; the lines it cannot shorten are long strings.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fake API responders are lambdas, and the contract tests warn about their own findings.
"tests/**" = ["E731", "B028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import their helpers, such as `fake_api`.
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not contract"]
markers = [
    "contract: runs against the real Todoist API; select with `pytest -m contract`",
]

[tool.coverage.run]
# Selected with `pytest --cov`.
source = ["todoist_takeout"]
branch = true
# Also measures the tests that run the CLI in a child process.
patch = ["subprocess"]

[tool.coverage.report]
# Below this, `pytest --cov` fails. It leaves room for the code that runs on one operating system only.
fail_under = 90
show_missing = true
skip_covered = true

[tool.ty.src]
# The production code; tests and scripts handle raw JSON and fakes, where types say little.
include = ["src"]

[tool.ty.environment]
# Also checks the code that runs on Windows or macOS only, such as the lock.
python-platform = "all"

[tool.ty.terminal]
# Warnings fail the check too, like every Ruff finding.
error-on-warning = true
