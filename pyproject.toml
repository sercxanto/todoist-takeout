[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "todoist-takeout"
description = "Keeps a complete, long-term readable local backup of a Todoist account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/sercxanto/todoist-takeout"
Documentation = "https://github.com/sercxanto/todoist-takeout#documentation"
Issues = "https://github.com/sercxanto/todoist-takeout/issues"

[dependency-groups]
dev = ["datasette>=0.65.5,<0.66", "pytest>=7", "pytest-cov>=7.1", "ruff>=0.17"]

[project.scripts]
todoist-takeout = "todoist_takeout.cli:main"

[tool.hatch.version]
path = "src/todoist_takeout/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_takeout"]

[tool.hatch.build.targets.sdist]
# The whole test suite with its fixtures and the fixture recorder it loads, so tests run from an
# unpacked sdist.
include = ["src/", "tests/", "scripts/", "README.md", "LICENSE"]
exclude = ["tests/contract/findings/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, Pyflakes, import sorting, pyupgrade and bugbear. Line length is left to the
# formatter; the lines it cannot shorten are long strings.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fake API responders are lambdas, and the contract tests warn about their own findings.
"tests/**" = ["E731", "B028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import their helpers, such as `fake_api`.
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not contract"]
markers = [
    "contract: runs against the real Todoist API; select with `pytest -m contract`",
]

[tool.coverage.run]
# Selected with `pytest --cov`.
source = ["todoist_takeout"]
branch = true
# Also measures the tests that run the CLI in a child process.
patch = ["subprocess"]

[tool.coverage.report]
# Below this, `pytest --cov` fails. It leaves room for the code that runs on one operating system only.
fail_under = 90
show_missing = true
skip_covered = true
