name: tests

# Runs only when started by hand (Actions -> tests -> Run workflow), to save the Actions minutes
# of a private repository, where macOS and Windows jobs count several times. Restore the triggers
# below before the first release or when the repository becomes public:
#
#   # Branches other than main are tested through their pull request, so that a push to
#   # a branch with an open pull request does not run the jobs twice.
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit hash, which a tag move cannot change; Dependabot keeps the hashes
# and the version comments up to date (.github/dependabot.yml).

jobs:
  lint:
    name: ruff and ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config for later steps.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check --output-format=github .
      - name: Format
        run: uv run --locked ruff format --check --diff .
      - name: Type check
        run: uv run --locked ty check --output-format=github

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # --locked fails the job when uv.lock no longer matches pyproject.toml.
        run: uv sync --locked
      - name: Test
        # Offline only: the contract tests are deselected by default and need tokens that CI does not have.
        # The coverage report goes to the log and to the job summary; bash also on Windows, for the variable.
        shell: bash
        run: uv run --locked pytest -rs --cov --cov-report=term --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
